name: nx-pipeline

# One run checks the affected Nx projects and, on master, builds, pushes and deploys the affected
# deployable apps (Nx `metadata.deploy`). Images are pushed only after this run's checks passed.
# Every input and matrix value reaches a shell through `env:` only.

on:
  workflow_call:
    inputs:
      environments:
        description: 'JSON map of environment to trigger, e.g. {"staging":"auto","production":"manual"}'
        type: string
        default: "{}"
      dispatch-environment:
        description: The environment a workflow_dispatch deploys; pass `inputs.environment` from the caller.
        type: string
        default: ""
      postgres:
        description: 'JSON {"image","user","password","db","port"} of a Postgres the checks need; empty for none'
        type: string
        default: ""
      setup:
        description: Repo script run with bash before the checks (tools, env files)
        type: string
        default: ""
      targets:
        description: Nx targets the checks run on the affected projects
        type: string
        default: lint format:check typecheck test build
      coolify-url:
        type: string
        default: ""
      # Starting guesses (Roman, 2026-11-10): checks ~7x the longest run seen (4 min); the wait outlasts
      # the checks job; build ~3x billhubs web without QEMU; deploy = platform's measured Coolify budget.
      checks-timeout:
        type: number
        default: 30
      wait-timeout:
        type: number
        default: 35
      build-timeout:
        type: number
        default: 15
      deploy-timeout:
        type: number
        default: 15
      release-timeout:
        type: number
        default: 70
    secrets:
      PACKAGES_TOKEN:
        description: Read token for the @vengex-org registry; defaults to this run's GITHUB_TOKEN
        required: false
      COOLIFY_READ_TOKEN:
        description: Read-only Coolify token for the pull request preflight
        required: false
      COOLIFY_TOKEN:
        description: Deploy token; keep it as an environment secret of each deploy environment
        required: false
      SENTRY_AUTH_TOKEN:
        description: Source map upload during release builds; environment secret
        required: false

permissions: {}

env:
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
      has-build: ${{ steps.plan.outputs.has-build }}
      has-release: ${{ steps.plan.outputs.has-release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - uses: $/actions/setup
        with:
          install-repo: "true"
          packages-token: ${{ secrets.PACKAGES_TOKEN || github.token }}
      - id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: master
          lookup-strategy: per-commit
      - name: list the affected projects
        id: affected
        env:
          NO_PREVIOUS_BUILD: ${{ steps.shas.outputs.noPreviousBuild }}
        run: |
          if [ "$NO_PREVIOUS_BUILD" = "true" ] || [ -z "$NX_BASE" ]; then
            echo "::notice::no green run on master to compare with, so every project is checked"
            PROJECTS=$(bunx nx show projects --json)
          else
            PROJECTS=$(bunx nx show projects --affected --json)
          fi
          echo "$PROJECTS" | jq -e 'type == "array"' >/dev/null
          echo "affected ($NX_BASE..$NX_HEAD): $PROJECTS" >> "$GITHUB_STEP_SUMMARY"
          echo "json=$PROJECTS" >> "$GITHUB_OUTPUT"
          echo "projects=$(echo "$PROJECTS" | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
      - run: bunx nx graph --file=.nx-graph.json
      - name: plan the image builds and deploys
        id: plan
        env:
          PIPELINE_INPUT_ENVIRONMENTS: ${{ inputs.environments }}
          PIPELINE_INPUT_POSTGRES: ${{ inputs.postgres }}
          PIPELINE_INPUT_CHECKS_TIMEOUT: ${{ inputs.checks-timeout }}
          PIPELINE_INPUT_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
          PIPELINE_INPUT_BUILD_TIMEOUT: ${{ inputs.build-timeout }}
          PIPELINE_INPUT_DEPLOY_TIMEOUT: ${{ inputs.deploy-timeout }}
          PIPELINE_INPUT_RELEASE_TIMEOUT: ${{ inputs.release-timeout }}
          DISPATCH_ENVIRONMENT: ${{ inputs.dispatch-environment }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          NX_AFFECTED_JSON: ${{ steps.affected.outputs.json }}
          NX_GRAPH_FILE: .nx-graph.json
        run: bun .ci/src/plan/main.ts

  checks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.checks-timeout }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - uses: $/actions/setup
        with:
          install-repo: "true"
          packages-token: ${{ secrets.PACKAGES_TOKEN || github.token }}
      - name: start postgres
        if: inputs.postgres != ''
        env:
          POSTGRES: ${{ inputs.postgres }}
        run: bun .ci/src/checks/postgres-main.ts
      - name: repo setup
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: |
          if ! [[ "$SETUP" =~ ^[A-Za-z0-9._/-]+$ ]] || [ ! -f "$SETUP" ]; then
            echo "::error::setup must name a script file in the repo, got: $SETUP"
            exit 1
          fi
          bash "$SETUP"
      - name: run the checks on the affected projects
        if: needs.prepare.outputs.projects != ''
        env:
          TARGETS: ${{ inputs.targets }}
          PROJECTS: ${{ needs.prepare.outputs.projects }}
          VENGEX_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
        run: |
          if ! [[ "$TARGETS" =~ ^[a-z0-9:_\ -]+$ ]]; then
            echo "::error::targets must be Nx target names separated by spaces, got: $TARGETS"
            exit 1
          fi
          read -ra TARGET_LIST <<< "$TARGETS"
          bunx nx run-many -t "${TARGET_LIST[@]}" -p "$PROJECTS"
      - name: no affected project
        if: needs.prepare.outputs.projects == ''
        run: echo "::notice::no affected project, nothing checked"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request'
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  # Pull requests from this repo: build each affected image without pushing, and read the Coolify
  # resources it would deploy to. Read permissions and read tokens only.
  build:
    needs: prepare
    if: needs.prepare.outputs.has-build == 'true'
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: ${{ inputs.build-timeout }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.prepare.outputs.build) }}
    name: build (${{ matrix.leg.app }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - uses: $/actions/setup
        with:
          install-repo: ${{ matrix.leg.prebuild != null }}
          packages-token: ${{ secrets.PACKAGES_TOKEN || github.token }}
      - name: prebuild
        if: matrix.leg.prebuild != null
        env:
          PREBUILD: ${{ matrix.leg.prebuild }}
          VENGEX_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
        run: bunx nx run "$PREBUILD"
      - id: args
        env:
          LEG_KIND: build
          LEG_JSON: ${{ toJSON(matrix.leg) }}
          REPO_VARS_JSON: ${{ toJSON(vars) }}
        run: bun .ci/src/image/build-args-main.ts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.leg.context }}
          file: ${{ matrix.leg.dockerfile }}
          platforms: ${{ matrix.leg.platform }}
          build-args: ${{ steps.args.outputs.build-args }}
          secrets: |
            vengex_packages_token=${{ secrets.PACKAGES_TOKEN || github.token }}
          cache-from: type=registry,ref=${{ matrix.leg.image }}:buildcache-${{ matrix.leg.environment }}
          push: false
      - name: check the coolify resources (read only)
        env:
          LEG_JSON: ${{ toJSON(matrix.leg) }}
          COOLIFY_URL: ${{ inputs.coolify-url }}
          COOLIFY_READ_TOKEN: ${{ secrets.COOLIFY_READ_TOKEN }}
        run: |
          if [ -z "$COOLIFY_READ_TOKEN" ]; then
            echo "::warning::COOLIFY_READ_TOKEN is not set, the coolify preflight did not run"
            exit 0
          fi
          bun .ci/src/deploy/preflight-main.ts

  # Push to master or a dispatch on master: build, wait for this run's checks, push, deploy, move the tag.
  release:
    needs: prepare
    if: >-
      needs.prepare.outputs.has-release == 'true'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: ${{ inputs.release-timeout }}
    environment: ${{ matrix.leg.environment }}
    # A deploy is never cancelled half way; a newer pending run replaces an older pending one,
    # which is safe because the plan compares against deployed/<env>/<app>.
    concurrency:
      group: deploy-${{ github.repository }}-${{ matrix.leg.environment }}-${{ matrix.leg.app }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.prepare.outputs.release) }}
    name: release (${{ matrix.leg.app }} to ${{ matrix.leg.environment }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - uses: $/actions/setup
        with:
          install-repo: ${{ matrix.leg.prebuild != null }}
          packages-token: ${{ secrets.PACKAGES_TOKEN || github.token }}
      - name: prebuild
        if: matrix.leg.prebuild != null
        env:
          PREBUILD: ${{ matrix.leg.prebuild }}
          VENGEX_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
        run: bunx nx run "$PREBUILD"
      - id: args
        env:
          LEG_KIND: release
          LEG_JSON: ${{ toJSON(matrix.leg) }}
          REPO_VARS_JSON: ${{ toJSON(vars) }}
        run: bun .ci/src/image/build-args-main.ts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.leg.context }}
          file: ${{ matrix.leg.dockerfile }}
          platforms: ${{ matrix.leg.platform }}
          build-args: ${{ steps.args.outputs.build-args }}
          secrets: |
            vengex_packages_token=${{ secrets.PACKAGES_TOKEN || github.token }}
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=registry,ref=${{ matrix.leg.image }}:buildcache-${{ matrix.leg.environment }}
          push: false
      - name: wait for this run's checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAIT_TIMEOUT_MINUTES: ${{ inputs.wait-timeout }}
        run: bun .ci/src/image/wait-main.ts
      # Same builder and inputs as the build above: every layer is cached, so this only exports and pushes.
      - name: push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.leg.context }}
          file: ${{ matrix.leg.dockerfile }}
          platforms: ${{ matrix.leg.platform }}
          build-args: ${{ steps.args.outputs.build-args }}
          secrets: |
            vengex_packages_token=${{ secrets.PACKAGES_TOKEN || github.token }}
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=registry,ref=${{ matrix.leg.image }}:buildcache-${{ matrix.leg.environment }}
          cache-to: type=registry,ref=${{ matrix.leg.image }}:buildcache-${{ matrix.leg.environment }},mode=max,image-manifest=true
          provenance: false
          tags: ${{ matrix.leg.image }}:${{ matrix.leg.tag }}
          push: true
      - name: deploy to coolify and move the deployed tag
        env:
          LEG_JSON: ${{ toJSON(matrix.leg) }}
          COOLIFY_URL: ${{ inputs.coolify-url }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEPLOY_TIMEOUT_MINUTES: ${{ inputs.deploy-timeout }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun .ci/src/deploy/release-main.ts
